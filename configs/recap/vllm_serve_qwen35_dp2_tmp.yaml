# vLLM serve config for the no-system-prompt CC12M baseline.
# Intended for 2 H200 GPUs with one Qwen3.5-35B-A3B-FP8 replica per GPU.
model: "Qwen/Qwen3.5-35B-A3B-FP8"
served-model-name: "Qwen/Qwen3.5-35B-A3B-FP8"
host: "0.0.0.0"
port: 8000
data-parallel-size: 2
tensor-parallel-size: 1
dtype: "auto"
gpu-memory-utilization: 0.92
max-model-len: 2048
max-num-seqs: 512
reasoning-parser: "qwen3"
default-chat-template-kwargs: '{"enable_thinking": false}'
enable-chunked-prefill: true
enable-prefix-caching: true
mm-processor-cache-type: "shm"
limit-mm-per-prompt: '{"image": 1}'
allowed-local-media-path: "/"
enable-log-requests: false
disable-uvicorn-access-log: true
uvicorn-log-level: "warning"
