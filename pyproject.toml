[project]
name = "audit-recap-t2i"
version = "1.0.0"
description = "Matched-budget audit framework for recaptioned image-text supervision distributions (NeurIPS 2026 Evaluations & Datasets)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [
    { name = "Giyeong Oh" },
    { name = "Junghun Park" },
    { name = "Yuhan Bae" },
    { name = "Youngjae Yu" },
]
dependencies = [
    "aiohttp>=3.9",
    "datasets>=3.0",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "orjson>=3.9",
    "pandas>=2.1",
    "pillow>=10.0",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Encoder-side probes: embedding Vendi/eRank/PRDC, LongCLIP retrieval, tokenizer truncation.
eval = [
    "torch>=2.4",
    "transformers>=4.51",
    "sentence-transformers>=3.0",
    "flagembedding>=1.3",
]
# vLLM for serving the captioner and the judges in the project environment. The
# scripts in scripts/vllm/ instead build a separate pinned environment in /tmp.
vllm = [
    "vllm==0.20.1",
]
dev = [
    "pytest>=8.0",
]

[project.urls]
Paper = "https://openreview.net/forum?id=JobgYHJvPo"
Homepage = "https://bootsoflagrangian.github.io/audit-recap-t2i.github.io/"
Dataset = "https://huggingface.co/collections/BootsofLagrangian/recaptioned-image-text-6ab5bf978e69805c3e33d5ce"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_recap_t2i"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
